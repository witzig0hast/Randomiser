<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Randomiser</title>
    <meta name="description" content="Zufall fair und sofort: Ja/Nein, Münzwurf, Würfel, Zufallszahlen, Glücksrad, Teams auslosen und mehr. Alles lokal im Browser. / Fair randomness: yes/no, coin flip, dice, random numbers, wheel of fortune and more, all in your browser." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="%CSS%" />
    <script src="%BOOT%"></script>
    <script type="module" src="%APP%"></script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <p class="noscript">Randomiser benötigt JavaScript, um Zufallswerte lokal in deinem Browser zu erzeugen. / Randomiser needs JavaScript to generate random values locally in your browser.</p>
    </noscript>
  </body>
</html>

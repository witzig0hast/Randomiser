# Produktionskonfiguration für Randomiser (statische Dateien hinter Nginx Proxy Manager und Cloudflare).
# Ziele: minimale Ressourcen, kleine Angriffsfläche, Schutz gegen Anfrageflut.

worker_processes auto;
worker_rlimit_nofile 4096;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    server_tokens off;

    # Das Dateisystem des Containers ist read-only; alle temporären Pfade liegen auf dem tmpfs.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Nur Auffälliges loggen (alles außer 2xx/3xx). Spart I/O und hält Logs lesbar.
    map $status $log_it {
        ~^[23] 0;
        default 1;
    }
    access_log /dev/stdout combined if=$log_it;

    # ---- Echte Client-IP -----------------------------------------------------
    # Cloudflare setzt CF-Connecting-IP, der Nginx Proxy Manager reicht den Header durch.
    # Vertraut wird ihm nur von privaten Adressen (Proxy im Docker-/LAN-Netz). Wer den Port
    # direkt aus dem Internet anspricht, kann den Header daher nicht fälschen.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    set_real_ip_from fc00::/7;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;

    # ---- Schutz vor Anfrageflut ---------------------------------------------
    # Eine Seitenladung braucht ~4 Requests (HTML, JS, CSS, Favicon).
    # 10 r/s mit Burst 40 ist für Menschen großzügig, für Skripte aber ein klares Limit.
    limit_req_zone  $binary_remote_addr zone=per_ip:2m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:2m;
    limit_req_status  429;
    limit_conn_status 429;

    # ---- Ressourcenschonende Auslieferung ------------------------------------
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 15s;
    keepalive_requests 200;
    reset_timedout_connection on;

    client_header_timeout 5s;
    client_body_timeout 5s;
    send_timeout 10s;
    client_max_body_size 1k;
    client_header_buffer_size 2k;
    large_client_header_buffers 4 8k;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml text/plain;

    open_file_cache max=64 inactive=60s;
    open_file_cache_valid 60s;
    open_file_cache_errors on;

    server {
        # Nur IPv4: Docker leitet per IPv4 weiter, und Hosts ohne IPv6 würden bei einem [::]-Listener abstürzen.
        listen 8080 default_server;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        limit_req  zone=per_ip burst=40 nodelay;
        limit_conn conn_per_ip 30;

        # Es werden nur Dateien ausgeliefert, nichts anderes.
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        # Docker-Healthcheck
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Startseite: immer revalidieren (ETag), damit neue Versionen sofort greifen.
        location = / {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache" always;
            try_files /index.html =404;
        }
        location = /index.html {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache" always;
        }

        # Gebündelte Dateien tragen den Inhalts-Hash im Namen und sind unveränderlich.
        # Cloudflare und Browser können sie ein Jahr lang cachen.
        location /assets/ {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        location / {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=86400" always;
            try_files $uri =404;
        }

        # Versteckte Dateien und Quellkarten nie ausliefern.
        location ~ /\.|\.map$ {
            return 404;
        }
    }
}
